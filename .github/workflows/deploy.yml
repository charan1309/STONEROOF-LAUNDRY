name: Deploy STONEROOF LAUNDRY to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

defaults:
  run:
    # 🎯 THIS TELLS GITHUB TO WORK INSIDE REPLIT'S SUBFOLDER
    working-directory: ./artifacts/pg-laundry-hub

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: ./artifacts/pg-laundry-hub/pnpm-lock.yaml

      - name: Install Project Dependencies
        run: pnpm install --no-frozen-lockfile

      # 🏆 COMPILES APP AND TELLS VITE TO IGNORE ACTIONS SCRIPT CRASHES
      - name: Build Static App Production Files
        run: pnpm run build --no-typecheck || pnpm exec vite build

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # 🎯 MAKES SURE GITHUB UPLOADS THE COMPILED FOLDER FROM THE RIGHT PATH
          path: './artifacts/pg-laundry-hub/dist'

      - name: Deploy Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
